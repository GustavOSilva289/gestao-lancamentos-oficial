<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#1F5C3F">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./logo.svg" type="image/svg+xml">

  <title>Gestão de Lançamentos</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #153F2B;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
    }

    .loading {
      text-align: center;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    p {
      font-size: 13px;
      opacity: .8;
      margin: 0;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: white;
      border-radius: 50%;
      margin: 20px auto 0;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loading">

    <img
      class="logo"
      src="./logo.svg"
      alt="Gestão de Lançamentos"
    >

    <h1>Gestão de Lançamentos</h1>

    <p>Abrindo o sistema...</p>

    <div class="spinner"></div>

  </div>

  <script>

    const APP_URL =
      'https://script.google.com/macros/s/AKfycbxVwlijrxJ4fIG0MDTc0W3GgScDtmDr0WKwkTTfv1ezwB1OYKb8r83Nf5g93gznqJ65bg/exec';

    /*
     * Redireciona diretamente para o Apps Script.
     *
     * Não usamos iframe.
     * Não usamos fetch.
     * Não usamos Service Worker para carregar o sistema.
     */

    window.location.replace(APP_URL);

  </script>

</body>
</html>
