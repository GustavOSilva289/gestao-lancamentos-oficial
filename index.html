<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#1F5C3F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lançamentos">

<link rel="manifest" href="./manifest.json">

<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">

<title>Gestão de Lançamentos</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #153F2B; font-family: Arial, Helvetica, sans-serif; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }

#loading { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 30px; text-align: center; color: #ffffff; }
#logo { width: 110px; height: 110px; object-fit: contain; margin-bottom: 20px; }
#titulo { margin: 0; font-size: 23px; font-weight: 700; line-height: 1.2; }
#mensagem { margin-top: 8px; font-size: 13px; opacity: .8; }

#spinner { width: 32px; height: 32px; margin-top: 22px; border: 3px solid rgba(255,255,255,.25); border-top-color: #ffffff; border-radius: 50%; animation: girar .8s linear infinite; }
@keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

#erro { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; flex-direction: column; padding: 30px; text-align: center; color: #ffffff; }
#erro.mostrar { display: flex; }
#erro h2 { margin: 0 0 10px; font-size: 21px; }
#erro p { max-width: 360px; margin: 0 0 20px; font-size: 14px; line-height: 1.5; opacity: .85; }
#btnTentar { border: 0; border-radius: 10px; padding: 13px 22px; background: #ffffff; color: #153F2B; font-size: 14px; font-weight: 700; cursor: pointer; }
#btnTentar:active { transform: scale(.97); }

#btnInstalar {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 22px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 10px;
  padding: 11px 20px;
  background: rgba(255,255,255,.08);
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
#btnInstalar.mostrar { display: inline-flex; }
#btnInstalar:active { transform: scale(.97); }
#btnInstalar svg { width: 16px; height: 16px; }

@supports (padding-top: env(safe-area-inset-top)) {
  #loading, #erro { padding-top: calc(30px + env(safe-area-inset-top)); padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>

<div id="loading">
  <img id="logo" src="./logo.svg" alt="Gestão de Lançamentos" onerror="this.style.display='none'">
  <h1 id="titulo">Gestão de Lançamentos</h1>
  <div id="mensagem">Abrindo o sistema...</div>
  <div id="spinner"></div>

  <button id="btnInstalar" type="button" onclick="instalarApp()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    Instalar app
  </button>
</div>

<div id="erro">
  <h2>Não foi possível abrir o sistema</h2>
  <p>Verifique sua conexão com a internet e tente novamente.</p>
  <button id="btnTentar" type="button" onclick="abrirSistema()">Tentar novamente</button>
</div>

<script>
const APP_URL = 'https://script.google.com/macros/s/AKfycbxVwlijrxJ4fIG0MDTc0W3GgScDtmDr0WKwkTTfv1ezwB1OYKb8r83Nf5g93gznqJ65bg/exec';

const loading = document.getElementById('loading');
const erro = document.getElementById('erro');
const mensagem = document.getElementById('mensagem');
const btnInstalar = document.getElementById('btnInstalar');

let deferredPrompt = null;
let timerAbertura = null;

const jaInstalado =
  window.matchMedia('(display-mode: standalone)').matches ||
  window.navigator.standalone === true;

if (!jaInstalado) {
  window.addEventListener('beforeinstallprompt', function (event) {
    event.preventDefault();
    deferredPrompt = event;
    btnInstalar.classList.add('mostrar');

    // Dá um tempo extra pro usuário ver e tocar no botão
    // antes de seguir para o sistema automaticamente.
    if (timerAbertura) {
      clearTimeout(timerAbertura);
    }
    timerAbertura = setTimeout(abrirSistema, 4000);
  });
}

window.addEventListener('appinstalled', function () {
  btnInstalar.classList.remove('mostrar');
  deferredPrompt = null;
});

function instalarApp() {
  if (!deferredPrompt) {
    return;
  }

  if (timerAbertura) {
    clearTimeout(timerAbertura);
  }

  btnInstalar.disabled = true;

  deferredPrompt.prompt();

  deferredPrompt.userChoice.finally(function () {
    deferredPrompt = null;
    btnInstalar.classList.remove('mostrar');
    btnInstalar.disabled = false;
    abrirSistema();
  });
}

function abrirSistema() {
  try {
    mensagem.textContent = 'Abrindo o sistema...';
    loading.style.display = 'flex';
    erro.classList.remove('mostrar');
    window.location.replace(APP_URL);
  } catch (e) {
    console.error('Erro ao abrir o sistema:', e);
    loading.style.display = 'none';
    erro.classList.add('mostrar');
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(function (registration) {
        console.log('[PWA] Service Worker registrado:', registration.scope);
      })
      .catch(function (error) {
        console.warn('[PWA] Service Worker não registrado:', error);
      });
  });
}

window.addEventListener('load', function () {
  console.log('[PWA] Gestão de Lançamentos iniciado.');
  timerAbertura = setTimeout(function () { abrirSistema(); }, 300);
});

window.addEventListener('error', function (event) {
  console.error('[PWA] Erro:', event.error || event.message);
});

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    console.log('[PWA] Aplicação visível.');
  }
});
</script>

</body>
</html>
